# pve-unifi-dns settings: /etc/pve/priv/pve-unifi-dns.conf (root only, shared in a cluster).
# Normally edited from Proxmox > Datacenter > UniFi DNS > Setup.
UNIFI_HOST=192.168.1.1
# UniFi OS > Settings > Control Plane > Integrations > Create API Key
UNIFI_API_KEY=
UNIFI_SITE=default
# suffix for every guest: <vm name>.<DOMAIN>  (match the Domain Name set on your UniFi network)
DOMAIN=home.arpa
VERIFY_TLS=false
# keep records for stopped guests (only possible when the IP is still known: LXC static ip or UniFi lease)
INCLUDE_STOPPED=false
# only sync guests carrying this Proxmox tag; empty = all guests (guests tagged nodns are always skipped)
ONLY_TAG=
# write a "UniFi DNS: ..." status line into each guest's Notes
WRITE_NOTES=true
# also publish <node>.<DOMAIN> for every online Proxmox node (static-IP hosts never register via DHCP)
PUBLISH_NODES=true
# hostname of the node that does the work. Lets you enable the timer on every node;
# the others exit at once. Empty = whichever node runs it.
RUN_ON_NODE=
STATE_FILE=/var/lib/pve-unifi-dns/state.json
STATUS_FILE=/var/lib/pve-unifi-dns/status.json
# UniFi client list: name = Proxmox guest name, icon = picked / matched / DEFAULT_ICON
SYNC_CLIENT_NAMES=true
SYNC_CLIENT_ICONS=true
# UniFi device id for guests with no better icon (5254 = Proxmox)
DEFAULT_ICON=5254
ICON_FILE=/etc/pve/pve-unifi-dns.icons.json
